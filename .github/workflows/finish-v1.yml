name: Publish verified v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-v1.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: trynet-release
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 17e11999ae63600deb6b33b94ebbbd97995c2013
      RELEASE_TAG: v1.0.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require the original build and every native verification to have passed
        run: |
          python3 - <<'PY'
          from scripts.publish import api
          run = api('/actions/runs/35733790210')
          assert run['head_sha'] == '17e11999ae63600deb6b33b94ebbbd97995c2013'
          assert run['status'] == 'completed'
          jobs = api('/actions/runs/35733790210/jobs?per_page=100')['jobs']
          required = {'prepare', 'build', 'Verify windows-amd64', 'Verify windows-arm64', 'Verify linux-amd64', 'Verify linux-arm64', 'Verify darwin-amd64', 'Verify darwin-arm64'}
          passed = {j['name'] for j in jobs if j['conclusion'] == 'success'}
          assert required <= passed, required - passed
          print('Original build and all six native verification jobs passed')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
          github-token: ${{ github.token }}
          repository: BlakeLiAFK/trynet
          run-id: 35733790210
      - name: Verify uploaded asset digests and publish the existing draft by ID
        run: python3 scripts/publish.py
