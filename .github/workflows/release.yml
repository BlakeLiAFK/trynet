name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trynet-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source commit
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Manual releases must run from main'; exit 1; }
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d '\r\n' < VERSION)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          sha="$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-parse "$tag^{commit}")"
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag && "$tagged_sha" != "$sha" ]]; then
              echo 'Version tag already points to another commit; increment VERSION'; exit 1
            fi
            sha="$tagged_sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Dependencies, static analysis, tests and race detector
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
      - name: Install checksum-pinned UPX 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/upx.tar.xz" https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz
          echo "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  $RUNNER_TEMP/upx.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-5.2.1-amd64_linux" >> "$GITHUB_PATH"
      - name: Build, pack, verify and archive all six targets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/release.py --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Archive exact source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/trynet-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/trynet-source.zip
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Verify ${{ matrix.target }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-amd64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: darwin-amd64, runner: macos-15-intel}
          - {target: darwin-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Native unit tests
        run: go test -count=1 ./...
      - name: Verify packaged executables on the native OS and architecture
        run: python scripts/smoke.py --target ${{ matrix.target }}
  publish:
    needs: [prepare, build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Publish only after every native verification passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/publish.py
