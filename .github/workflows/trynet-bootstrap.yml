name: TryNet Repository Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.trynet-bootstrap/READY2'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staged repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .trynet-bootstrap/payload-* > /tmp/trynet-source.b64
          base64 -d /tmp/trynet-source.b64 > /tmp/trynet-source.tar.xz
          echo '884c169415afd0549253e2d2c6d01549815ab24dbbff7b46dc12a849e181dcf5  /tmp/trynet-source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/trynet-source
          tar -xJf /tmp/trynet-source.tar.xz -C /tmp/trynet-source

      - name: Replace old repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/trynet-source/. .

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Restore image assets and Windows resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets internal/fileshare/web
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/BlakeLiAFK/trynet/fe584e83724b3cedae3f2085d476a783276b9205/build/appicon.png'             -o assets/trynet-icon.png
          cp assets/trynet-icon.png internal/fileshare/web/icon.png
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/BlakeLiAFK/trynet/fe584e83724b3cedae3f2085d476a783276b9205/build/windows/icon.ico'             -o assets/trynet.ico
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico assets/trynet.ico -arch amd64 -o rsrc_windows_amd64.syso

      - name: Commit clean TryNet source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: replace repository with TryNet v1.0.0'
          git push origin HEAD:main
